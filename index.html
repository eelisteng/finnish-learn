<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F7FA">
<meta name="description" content="一词一图，一格一义。免登录的芬兰语分级学习：A1–C2 分级、每组 5 词/句，词干与基本格、动词类型、每词配图一目了然，进度可导出导入。">
<title>Finnish Learn · 一词一图，一格一义</title>
<script>
/* Apply the saved theme before the stylesheet paints, so a dark-mode
   reload never flashes a white page. */
try {
  var saved = JSON.parse(localStorage.getItem('finnish-learn:v1') || '{}')
  var choice = (saved.preferences || {}).theme || 'system'
  var dark = choice === 'dark' || (choice === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#101922' : '#F4F7FA')
} catch (e) { document.documentElement.dataset.theme = 'light' }
</script>
<link rel="stylesheet" href="app/styles.css">
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>此学习页面需要启用 JavaScript。</noscript>
<script src="app/data.js"></script>
<script src="app/grouping.js"></script>
<script src="app/store.js"></script>
<script src="app/bgm.js"></script>
<script src="app/main.js"></script>
</body>
</html>
