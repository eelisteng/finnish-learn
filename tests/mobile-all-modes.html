<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F7FA">
<!-- The content pack stores repo-root-relative image paths. Without a base,
     a page inside tests/ resolves them to tests/assets/... and every <img>
     silently degrades to the geometric placeholder, so dark-variant checks
     would pass vacuously. -->
<base href="../">
<title>全模式移动端回归 · all practice modes layout regression</title>
<link rel="stylesheet" href="app/styles.css">
<style>
  body{background:var(--bg);color:var(--text)}
  #out{padding:12px;font:12px/1.5 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div><div id="modal-root"></div><div id="toast" class="toast"></div>
<pre id="out">RUNNING</pre>
<script>
/* Driven by scripts/test-webkit.mjs through tests/webkit-find-image.swift.
   Seeds a paused session directly in the requested practice mode, resumes it,
   then exposes window.__WEBKIT_PROBE() with geometry + assertions. The same
   page works in Chrome (for a quick manual look) and in WKWebView. */
window.FI_FAST_TEST = false; window.FI_TEST_AUTOPLAY = true; window.FI_TEST_FIXED_ITEMS = true
try {
  Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true,
    value: class { constructor(text) { this.text = text; this.lang = ''; this.rate = 1; this.pitch = 1 } } })
  Object.defineProperty(window, 'speechSynthesis', { configurable: true,
    value: { cancel() {}, speak() {}, getVoices() { return [] } } })
} catch (e) { /* built-ins may be non-configurable */ }
window.Audio = class {
  constructor() { this._src = '' }
  set src(v) { this._src = v } get src() { return this._src }
  set currentTime(v) {} get currentTime() { return 0 }
  pause() {} play() { return Promise.resolve() }
}
</script>
<script src="app/data.js"></script>
<script src="app/grouping.js"></script>
<script src="app/i18n.js"></script>
<script src="app/store.js"></script>
<script src="app/bgm.js"></script>
<script src="app/main.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)]
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const P = new URLSearchParams(location.search)
  const MODE = P.get('mode') || 'choice'
  const DARK = P.has('dark')
  const LONG = P.has('long')
  const STAGE_KEY = 'fi-all-modes-stage'
  const out = document.getElementById('out')

  if (!sessionStorage.getItem(STAGE_KEY)) {
    sessionStorage.setItem(STAGE_KEY, '1')
    localStorage.removeItem('finnish-learn:v1')
    document.documentElement.dataset.theme = DARK ? 'dark' : 'light'
    const g = window.FI_DATA.groups.groups.find((x) => x.id === 'A1-W-01')
    const pack = window.FI_DATA.pack
    const scope = g.itemIds.slice()
    const pipeline = FI.buildPipeline('word', FI.DEFAULT_MODES)
    const r = {
      mode: MODE, scopeIds: scope, attempt: 1, index: 0, questions: [],
      answers: [], feedback: null, hintsUsed: 0, hintRevealed: [], slots: [],
      lastInput: '', speed: 'normal', selected: null, flash: null,
      matched: [], mismatches: [], pairs: null,
    }
    if (MODE === 'choice') {
      r.questions = FI.buildChoiceQuestions(g, pack, { scopeIds: scope, seed: 0, optionCount: 4 })
    } else if (MODE === 'listen' || MODE === 'findImage') {
      r.questions = FI.buildSelectQuestions(g, pack, {
        scopeIds: scope, seed: 0, optionCount: 4,
        textOnly: MODE === 'findImage', hideLabel: MODE === 'listen', meaningLang: 'both',
      })
      if (LONG) {
        const longWords = ['henkilöllisyystodistus', 'todennäköisesti', 'yhteisymmärrys', 'kansainvälinen']
        r.questions.forEach((q) => q.options.forEach((o, i) => { o.label = longWords[i] }))
      }
    } else if (MODE === 'match') {
      r.pairs = FI.buildMatchPairs(g, pack, scope, 0, 'both')
    } else if (MODE === 'cloze' || MODE === 'dictation') {
      r.questions = FI.buildLetterQuestions(g, pack, scope, MODE, 'both')
      r.slots = r.questions[0].letters.map((ch, i) => (r.questions[0].reveal[i] ? ch : ''))
    } else {
      out.textContent = 'FAIL unknown mode ' + MODE
      return
    }
    const session = {
      groupId: g.id, level: g.level, kind: 'word', itemIds: scope, seed: 0,
      pipeline, pipelineIndex: pipeline.indexOf(MODE), phase: MODE,
      scopeIds: scope, attempt: 1, retryCount: 0, results: {}, lastResult: null,
      lastWrongIds: [], startedAt: new Date().toISOString(), _spoken: null, _flipSpoken: null,
      round: r,
    }
    const state = FI.Store.load()
    state.preferences.theme = DARK ? 'dark' : 'light'
    state.session = session; state.paused = true
    FI.Store.save(state)
    location.reload()
    return
  }

  const resume = $('[data-act="resume"]')
  if (resume) resume.click()
  await wait(140)
  document.documentElement.dataset.theme = DARK ? 'dark' : 'light'

  const checks = []
  const ok = (name, cond, detail = '') => checks.push({ name, pass: Boolean(cond), detail: cond ? '' : String(detail) })
  const rect = (el) => { const b = el.getBoundingClientRect(); return [+b.width.toFixed(1), +b.height.toFixed(1)] }
  const css = (el, prop) => el ? getComputedStyle(el)[prop] : null
  const inViewport = (el) => { const b = el.getBoundingClientRect(); return b.x >= -1 && b.x + b.width <= window.innerWidth + 1 }
  const close = (a, b, tol = 1) => Math.abs(a - b) <= tol
  const ratio = ([w, h]) => w / h
  const lines = (el) => {
    if (!el) return 0
    const lh = parseFloat(css(el, 'lineHeight')) || parseFloat(css(el, 'fontSize')) * 1.3
    return rect(el)[1] / lh
  }

  const stage = $('.stage')
  ok('harness: the practice stage rendered', Boolean(stage), 'no .stage')
  ok('harness: correct mode is on screen', Boolean(stage) && stage.textContent.length > 20)
  ok('layout: no horizontal page overflow',
    document.documentElement.scrollWidth <= window.innerWidth + 1,
    `scrollWidth=${document.documentElement.scrollWidth} innerWidth=${window.innerWidth}`)
  ok(`theme: ${DARK ? 'dark' : 'light'} dataset is applied`,
    document.documentElement.dataset.theme === (DARK ? 'dark' : 'light'),
    `dataset=${document.documentElement.dataset.theme}`)

  /* Illustration theme checks run AFTER the interaction: find-image has no
     picture until the correct card is flipped. WebP art is shown as-is in
     both themes, so every <img> must keep the same .webp path in light and
     dark. A vacuous "0 images" pass is prevented by requiring real <img>
     elements (never the geometric-placeholder fallback) and by the runner's
     cross-case check that WebP paths were actually exercised. */
  let interactive = []
  let geometry = {}

  if (MODE === 'choice') {
    const opts = $$('.opts .opt')
    interactive = opts
    const boxes = opts.map(rect)
    const grid = $('.opts')
    const track = (css(grid, 'gridTemplateColumns') || '').trim().split(/\s+/).filter(Boolean)
    geometry.boxes = boxes; geometry.tracks = track
    ok('choice: four options rendered', opts.length === 4, `got ${opts.length}`)
    ok('choice: all four options share one width and height',
      boxes.length === 4 && boxes.every((b) => close(b[0], boxes[0][0]) && close(b[1], boxes[0][1])),
      JSON.stringify(boxes))
    ok('choice: options fill the whole grid column on WebKit',
      boxes.length === 4 && boxes.every((b) => close(b[0], parseFloat(track[0]))),
      JSON.stringify({ boxes, track }))
    ok('choice: every option is inside the viewport', opts.every(inViewport), JSON.stringify(boxes))
    ok('choice: no option stacks one glyph per line', opts.every((o) => lines(o) <= 3.2),
      JSON.stringify(opts.map((o) => +lines(o).toFixed(1))))
    ok('choice: question illustration is visible', Boolean($('.quiz-pic')) && rect($('.quiz-pic'))[0] > 20)
  } else if (MODE === 'listen') {
    const cards = $$('.optcards.with-meaning .optcard')
    interactive = cards
    const boxes = cards.map(rect)
    const grid = $('.optcards.with-meaning')
    const track = (css(grid, 'gridTemplateColumns') || '').trim().split(/\s+/).filter(Boolean)
    geometry.boxes = boxes; geometry.tracks = track
    ok('listen: four picture+meaning options rendered', cards.length === 4, `got ${cards.length}`)
    ok('listen: two columns on phones', window.innerWidth > 640 ? track.length === 4 : track.length === 2,
      `tracks=${track.join(' | ')}`)
    ok('listen: cards fill the whole grid column',
      boxes.length === 4 && boxes.every((b) => close(b[0], parseFloat(track[0]))),
      JSON.stringify({ boxes, track }))
    ok('listen: all four cards share one identical box',
      boxes.length === 4 && boxes.every((b) => close(b[0], boxes[0][0]) && close(b[1], boxes[0][1])),
      JSON.stringify(boxes))
    ok('listen: every card is inside the viewport', cards.every(inViewport))
    ok('listen: WebKit button alignment is reset to stretch',
      cards.every((c) => css(c, 'alignItems') === 'stretch'),
      JSON.stringify(cards.map((c) => css(c, 'alignItems'))))
    const pics = $$('.optcards.with-meaning .optcard-pic')
    const picBoxes = pics.map(rect)
    ok('listen: all four pictures have the same visible size',
      picBoxes.length === 4 && picBoxes.every((b) => b[0] > 20 && b[1] > 20 && close(b[0], picBoxes[0][0]) && close(b[1], picBoxes[0][1])),
      JSON.stringify(picBoxes))
  } else if (MODE === 'findImage') {
    const cards = $$('.optcards.find-image .optcard')
    const faces = cards.map((c) => c.querySelector('.flip-face'))
    interactive = cards
    const boxes = cards.map(rect), faceBoxes = faces.map(rect)
    geometry.boxes = boxes; geometry.faces = faceBoxes
    ok('findImage: four word options rendered', cards.length === 4, `got ${cards.length}`)
    ok('findImage: all four faces are 1:1 squares',
      faceBoxes.length === 4 && faceBoxes.every((b) => Math.abs(ratio(b) - 1) <= 0.02),
      JSON.stringify(faceBoxes.map((b) => +ratio(b).toFixed(3))))
    ok('findImage: all four faces share one identical box',
      faceBoxes.length === 4 && faceBoxes.every((b) => close(b[0], faceBoxes[0][0]) && close(b[1], faceBoxes[0][1])),
      JSON.stringify(faceBoxes))
    ok('findImage: faces fill the whole button width',
      cards.every((c, i) => close(rect(c.querySelector('.flip-inner'))[0], boxes[i][0])),
      JSON.stringify(cards.map((c) => rect(c.querySelector('.flip-inner')))))
    ok('findImage: WebKit button alignment is reset to stretch',
      cards.every((c) => css(c, 'alignItems') === 'stretch'),
      JSON.stringify(cards.map((c) => css(c, 'alignItems'))))
    ok('findImage: no label stacks one glyph per line',
      cards.every((c) => lines(c.querySelector('.optcard-label')) <= 3.2),
      JSON.stringify(cards.map((c) => +lines(c.querySelector('.optcard-label')).toFixed(1))))
    ok('findImage: no picture before answering', $$('.optcard .optcard-pic').length === 0)
  } else if (MODE === 'match') {
    const tiles = $$('.mtile')
    const rows = $$('.match-row')
    interactive = tiles
    const boxes = tiles.map(rect)
    const track = (css(rows[0], 'gridTemplateColumns') || '').trim().split(/\s+/).filter(Boolean)
    geometry.boxes = boxes; geometry.rows = rows.length; geometry.tracks = track
    ok('match: two rows of five tiles rendered', rows.length === 2 && tiles.length === 10,
      `rows=${rows.length} tiles=${tiles.length}`)
    ok('match: every tile is inside the viewport', tiles.every(inViewport), JSON.stringify(boxes))
    ok('match: all tiles share one width',
      boxes.length === 10 && boxes.every((b) => close(b[0], boxes[0][0])), JSON.stringify(boxes))
    ok('match: tiles fill the whole grid column on WebKit',
      boxes.length === 10 && rows.length === 2 && boxes.every((b) => close(b[0], parseFloat(track[0]))),
      JSON.stringify({ boxes, track }))
    ok('match: rows do not overflow their container',
      rows.every((row) => row.scrollWidth <= row.clientWidth + 1),
      JSON.stringify(rows.map((row) => [row.scrollWidth, row.clientWidth])))
    ok('match: tile labels do not stack one glyph per line',
      tiles.every((tile) => lines(tile) <= 4.2),
      JSON.stringify(tiles.map((tile) => +lines(tile).toFixed(1))))
  } else if (MODE === 'cloze' || MODE === 'dictation') {
    const slots = $$('#slots .slot')
    const inputs = $$('#slots input.slot')
    interactive = slots
    const boxes = slots.map(rect)
    geometry.boxes = boxes; geometry.slotCount = slots.length
    ok(`${MODE}: letter slots rendered`, slots.length >= 3, `got ${slots.length}`)
    ok(`${MODE}: every slot is inside the viewport`, slots.every(inViewport), JSON.stringify(boxes))
    ok(`${MODE}: slots row does not overflow`,
      Boolean($('#slots')) && $('#slots').scrollWidth <= $('#slots').clientWidth + 1,
      JSON.stringify([$('#slots')?.scrollWidth, $('#slots')?.clientWidth]))
    ok(`${MODE}: blank inputs are editable`, inputs.length > 0 && inputs.every((i) => !i.disabled),
      `inputs=${inputs.length}`)
    ok(`${MODE}: prompt illustration is visible`,
      Boolean($(MODE === 'cloze' ? '.cloze-pic' : '.quiz-pic')) &&
      rect($(MODE === 'cloze' ? '.cloze-pic' : '.quiz-pic'))[0] > 20)
  }

  ok('interaction: option boxes have a usable tap target',
    interactive.length > 0 && interactive.every((el) => rect(el)[0] >= 24 && rect(el)[1] >= 24),
    JSON.stringify(interactive.map(rect)))

  /* A real interaction must reach the app state, not just paint. This is the
     class of bug that a geometry-only Chrome regression cannot catch. */
  let acted = false
  if (MODE === 'choice' || MODE === 'listen' || MODE === 'findImage') {
    const q = FI.Store.load().session.round.questions[0]
    const correctIdx = q.options.findIndex((o) => o.id === q.itemId)
    const target = interactive[correctIdx]
    if (target) { target.click(); acted = true }
    const after = FI.Store.load().session.round.feedback
    ok('interaction: a tap sets answer feedback', acted && Boolean(after), JSON.stringify(after))
    if (MODE === 'findImage') {
      const back = $('.optcards.find-image .flip-back')
      const faceBoxes = $$('.optcards.find-image .flip-face').map((f) => [f.offsetWidth, f.offsetHeight])
      ok('interaction: the reveal keeps all four 1:1 boxes',
        faceBoxes.length === 4 && faceBoxes.every((b) => Math.abs(b[0] / b[1] - 1) <= 0.02 &&
          close(b[0], faceBoxes[0][0]) && close(b[1], faceBoxes[0][1])), JSON.stringify(faceBoxes))
      ok('interaction: the illustration is visible after the flip', Boolean(back) && rect(back)[0] > 20)
      const backPic = back?.querySelector('.optcard-pic')
      ok('interaction: the artwork fills the revealed square',
        Boolean(backPic) && close(rect(backPic)[0], rect(back)[0], 3) &&
          close(rect(backPic)[1], rect(back)[1], 3),
        JSON.stringify({ pic: backPic && rect(backPic), face: back && rect(back) }))
    }
  } else if (MODE === 'match') {
    const target = $('.mtile[data-act="match-left"]')
    if (target) { target.click(); acted = true }
    ok('interaction: a tap selects a tile', acted && $$('.mtile.selected').length === 1,
      `selected=${$$('.mtile.selected').length}`)
  } else if (MODE === 'cloze' || MODE === 'dictation') {
    const hint = $('.answer-row [data-act="hint"]')
    if (hint) { hint.click(); acted = true }
    ok('interaction: a tap reveals a hint', acted && FI.Store.load().session.round.hintsUsed === 1,
      `hintsUsed=${FI.Store.load().session.round.hintsUsed}`)
  }

  const finalPics = $$('.stage img')
  const imgSrcs = finalPics.map((p) => p.getAttribute('src') || '')
  const webpSrcs = imgSrcs.filter((s) => /\.webp$/i.test(s))
  const placeholders = $$('.stage [role="img"]')
  geometry.imgSrcs = imgSrcs
  ok('theme: no illustration degraded to a placeholder',
    placeholders.length === 0,
    JSON.stringify({ imgs: imgSrcs, placeholders: placeholders.length }))
  // match is a word-to-meaning tile game and intentionally has no picture.
  const expectsPicture = MODE !== 'match'
  ok('theme: illustrations are WebP, unchanged by theme',
    (!expectsPicture || webpSrcs.length > 0)
      && webpSrcs.every((s) => /assets\/illustrations\/[^/]+\.webp$/.test(s))
      && !imgSrcs.some((s) => /\.dark\./i.test(s)),
    JSON.stringify(imgSrcs))

  window.__WEBKIT_PROBE = function () {
    return JSON.stringify({
      mode: MODE, dark: DARK, long: LONG,
      innerWidth: window.innerWidth, phone: window.innerWidth <= 640,
      theme: document.documentElement.dataset.theme,
      scrollWidth: document.documentElement.scrollWidth,
      geometry, checks,
      pass: checks.filter((c) => c.pass).length,
      fail: checks.filter((c) => !c.pass).length,
    })
  }
  out.textContent = checks.map((c) => `${c.pass ? 'PASS' : 'FAIL'} ${c.name}${c.pass ? '' : ' :: ' + c.detail}`).join('\n') +
    `\n\nTOTAL ${checks.filter((c) => c.pass).length} passed, ${checks.filter((c) => !c.pass).length} failed\nWAITING_FOR_PROBE`
})()
</script>
</body>
</html>
