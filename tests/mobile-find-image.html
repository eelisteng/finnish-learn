<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移动端找图模式回归 · mobile find-image regression</title>
<link rel="stylesheet" href="../app/styles.css">
<style>
  body{background:var(--bg);color:var(--text)}
  #out{padding:12px;font:12px/1.5 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div><div id="modal-root"></div><div id="toast" class="toast"></div>
<pre id="out">RUNNING</pre>
<script>
/* This page is driven by scripts/test-mobile.mjs, which uses the DevTools
   Protocol for real device metrics + real touch events. It seeds a paused
   find-image session, reloads, resumes it, and exposes assertions before and
   after a synthetic finger tap on the correct card. */
if (!sessionStorage.getItem('fi-mobile-stage')) localStorage.removeItem('finnish-learn:v1')
window.FI_FAST_TEST = false; window.FI_TEST_AUTOPLAY = true; window.FI_TEST_FIXED_ITEMS = true
try {
  Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true,
    value: class { constructor(text) { this.text = text; this.lang = ''; this.rate = 1; this.pitch = 1 } } })
  Object.defineProperty(window, 'speechSynthesis', { configurable: true,
    value: { cancel() {}, speak() {}, getVoices() { return [] } } })
} catch (e) { /* built-ins may be non-configurable */ }
window.Audio = class {
  constructor() { this._src = '' }
  set src(v) { this._src = v } get src() { return this._src }
  set currentTime(v) {} get currentTime() { return 0 }
  pause() {} play() { return Promise.resolve() }
}
</script>
<script src="../app/data.js"></script>
<script src="../app/grouping.js"></script>
<script src="../app/i18n.js"></script>
<script src="../app/store.js"></script>
<script src="../app/bgm.js"></script>
<script src="../app/main.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)]
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const LONG = location.search.includes('long')
  const out = []
  const ok = (name, cond, detail = '') => out.push(`${cond ? 'PASS' : 'FAIL'} ${name}${cond ? '' : ' :: ' + detail}`)
  const rect = (el) => { if (!el) return null; const r = el.getBoundingClientRect(); return { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1) } }
  const css = (el, prop) => el ? getComputedStyle(el)[prop] : null

  if (!sessionStorage.getItem('fi-mobile-stage')) {
    sessionStorage.setItem('fi-mobile-stage', '1')
    const g = window.FI_DATA.groups.groups.find((x) => x.id === 'A1-W-01')
    const pack = window.FI_DATA.pack
    const scope = g.itemIds.slice()
    const pipeline = FI.buildPipeline('word', FI.DEFAULT_MODES)
    const questions = FI.buildSelectQuestions(g, pack, {
      scopeIds: scope, seed: 0, optionCount: 4, textOnly: true,
      hideLabel: false, meaningLang: 'both',
    })
    // Stress the narrow phone columns with the longest real workbook lemmas.
    const longWords = ['henkilöllisyystodistus', 'todennäköisesti', 'yhteisymmärrys', 'kansainvälinen']
    if (LONG) questions.forEach((q) => q.options.forEach((o, i) => { o.label = longWords[i] }))
    const session = {
      groupId: g.id, level: g.level, kind: 'word', itemIds: scope, seed: 0,
      pipeline, pipelineIndex: pipeline.indexOf('findImage'), phase: 'findImage',
      scopeIds: scope, attempt: 1, retryCount: 0, results: {}, lastResult: null,
      lastWrongIds: [], startedAt: new Date().toISOString(), _spoken: null, _flipSpoken: null,
      round: { mode: 'findImage', scopeIds: scope, attempt: 1, index: 0, questions,
        answers: [], feedback: null, hintsUsed: 0, hintRevealed: [], slots: [], lastInput: '',
        speed: 'normal', selected: null, flash: null, matched: [], mismatches: [], pairs: null },
    }
    const state = FI.Store.load()
    state.session = session; state.paused = true
    FI.Store.save(state)
    location.reload()
    return
  }

  const resume = $('[data-act="resume"]')
  if (resume) resume.click()
  await wait(90)

  /* ── assertions before the tap ───────────────────────────── */
  const grid = $('.optcards.find-image')
  const cards = $$('.optcard')
  const tracks = (css(grid, 'gridTemplateColumns') || '').trim().split(/\s+/).filter(Boolean)
  const IS_PHONE = window.innerWidth <= 640
  // Desktop reference measured on a 1280px viewport: 197 x 132 = 3:2.
  // The runner compares every phone case against the desktop case below.
  const DESKTOP_RATIO = 3 / 2
  const ratio = (r) => r.w / r.h
  const close = (a, b, tol = 0.02) => Math.abs(a - b) <= tol
  ok('viewport: phone width or 4-column desktop-class width', IS_PHONE || window.innerWidth >= 641,
    `innerWidth=${window.innerWidth}`)
  ok('find-image grid columns match the viewport class', tracks.length === (IS_PHONE ? 2 : 4),
    `tracks=${tracks.join(' | ')}`)
  ok('four word options rendered', cards.length === 4, `got ${cards.length}`)
  ok('cards do not overflow the viewport', cards.every((c) => {
    const r = rect(c); return r.x >= 0 && r.x + r.w <= window.innerWidth + 1
  }), JSON.stringify(cards.map(rect)))

  /* The 3:2 ratio must be identical on every card, on both faces, and on
     desktop AND phone. A fixed px height used to make 320px cards portrait
     (126 x 136), and a height:100% chain inside <button> resolves to auto in
     mobile WebKit so the flipped picture face could change height. */
  const faceRects = cards.map((c) => rect(c.querySelector('.flip-face')))
  const cardRects = cards.map(rect)
  const faceRatios = faceRects.map(ratio)
  window.__geometry = {
    width: window.innerWidth, phone: IS_PHONE, cols: tracks.length,
    faceRatios, cardRects: cardRects.map((r) => [r.w, r.h]),
    faceRects: faceRects.map((r) => [r.w, r.h]),
  }
  ok('ratio: every face is 3:2 like desktop',
    faceRatios.every((r) => close(r, DESKTOP_RATIO)), `ratios=${faceRatios.map((r) => r.toFixed(3)).join(', ')}`)
  ok('ratio: all four cards have identical width and height',
    cardRects.every((r) => close(r.w, cardRects[0].w, 1) && close(r.h, cardRects[0].h, 1)),
    JSON.stringify(cardRects))
  ok('ratio: the button box is exactly the face box (no extra height)',
    cards.every((c, i) => close(rect(c).h, faceRects[i].h, 1)))
  ok('ratio: the face height comes from aspect-ratio, not a fixed px height',
    css(cards[0].querySelector('.flip-face'), 'aspectRatio') === '3 / 2',
    `aspectRatio=${css(cards[0].querySelector('.flip-face'), 'aspectRatio')}`)
  /* Engine-independent guard for the real WebKit bug: <button> keeps an
     anonymous flex box that inherits .optcard's align-items:center, which
     shrink-wraps .flip-inner to the label width on iOS Safari and makes the
     four 3:2 faces four different sizes. Chrome ignores it, so this must be
     asserted explicitly rather than inferred from Chrome's geometry. */
  ok('ratio: button flex alignment is reset so faces stretch to full width',
    cards.every((c) => css(c, 'alignItems') === 'stretch'),
    `alignItems=${cards.map((c) => css(c, 'alignItems')).join(', ')}`)
  ok('ratio: no percentage-height chain inside the button',
    css(cards[0].querySelector('.flip-inner'), 'height') !== 'auto' &&
      parseFloat(css(cards[0].querySelector('.flip-inner'), 'height')) > 20,
    `innerHeight=${css(cards[0].querySelector('.flip-inner'), 'height')}`)
  ok('ratio: long labels still fit inside the face without clipping', cards.every((c) => {
    const f = c.querySelector('.flip-face'), l = c.querySelector('.optcard-label')
    const fr = rect(f), lr = rect(l), s = getComputedStyle(f)
    const insetTop = fr.y + parseFloat(s.paddingTop) + parseFloat(s.borderTopWidth)
    const insetBottom = fr.y + fr.h - parseFloat(s.paddingBottom) - parseFloat(s.borderBottomWidth)
    return lr.y >= insetTop - 1 && lr.y + lr.h <= insetBottom + 1
  }), JSON.stringify(cards.map((c) => rect(c.querySelector('.optcard-label')))))

  let definite = true, wrapOk = true, linesOk = true, flowOk = true, pointersOk = true
  const lineStats = []
  cards.forEach((c) => {
    const face = c.querySelector('.flip-face')
    const inner = c.querySelector('.flip-inner')
    const label = c.querySelector('.optcard-label')
    const cr = rect(c), fr = rect(face), lr = rect(label)
    const lh = parseFloat(css(label, 'lineHeight')) || parseFloat(css(label, 'fontSize')) * 1.3
    const lines = lr.h / lh
    lineStats.push(`${label.textContent}:${lines.toFixed(1)}`)
    if (!fr || fr.w < cr.w - 2) definite = false
    if (css(face, 'position') !== 'relative' || css(face, 'backfaceVisibility') === 'hidden') flowOk = false
    if (css(label, 'wordBreak') !== 'normal' || !/anywhere|break-word/.test(css(label, 'overflowWrap') || '')) wrapOk = false
    if (lines > 3.2) linesOk = false
    if (css(inner, 'pointerEvents') !== 'none' || css(face, 'pointerEvents') !== 'none') pointersOk = false
  })
  ok('card: each face has a definite full-width box (no abspos shrink)', definite)
  ok('card: faces are in normal flow with no 3D backface dependency', flowOk)
  ok('card: labels use standard wrapping, not legacy break-word', wrapOk)
  ok('card: no label stacks one glyph per line', linesOk, `lines=${lineStats.join(', ')}`)
  ok('card: overlay children never swallow the button tap', pointersOk)
  ok('card: no picture before answering', $$('.optcard .optcard-pic').length === 0 && $$('.flip-back').length === 0)

  const q0 = FI.Store.load().session.round.questions[0]
  const correctIdx = q0.options.findIndex((o) => o.id === q0.itemId)
  const cr = rect(cards[correctIdx])
  window.__tapTarget = { x: cr.x + cr.w / 2, y: cr.y + cr.h / 2 }
  window.__correctIdx = correctIdx
  // On a 320px phone the second row can sit below the fold. Scroll it into
  // view before the CDP runner dispatches a touch, otherwise the tap lands
  // outside the emulated screen.
  window.__prepareTap = function () {
    const c = cards[correctIdx]
    c.scrollIntoView({ block: 'center', inline: 'center' })
    const r = rect(c)
    return { x: r.x + r.w / 2, y: r.y + r.h / 2 }
  }

  /* ── assertions after a real touch tap ────────────────────── */
  window.__afterTap = function () {
    const flipped = $$('.optcard.flipped')
    const back = $('.optcards.find-image .flip-back')
    const pic = $('.optcards.find-image .flip-back .optcard-pic')
    const pr = rect(pic)
    ok('tap: the touch reached the button and set feedback', flipped.length === 1, `flipped=${flipped.length}`)
    ok('tap: the back face with the illustration is rendered', Boolean(back && pic))
    ok('tap: illustration has real visible size', Boolean(pr && pr.w > 20 && pr.h > 20), JSON.stringify(pr))
    ok('tap: back face is not a rotated 3D layer', Boolean(back) &&
      !/matrix3d/.test(css(back, 'transform') || '') && css(back, 'backfaceVisibility') !== 'hidden',
      `transform=${css(back, 'transform')}`)
    /* rotateY()/perspective() used to squash the visual box during the flip.
       The reveal must be opacity-only so no engine can change the ratio. */
    ok('tap: the reveal applies no squashing transform',
      css($('.optcard.flipped .flip-inner'), 'transform') === 'none',
      `transform=${css($('.optcard.flipped .flip-inner'), 'transform')}`)
    ok('tap: the other three cards stay word-only', $$('.optcard:not(.flipped) .optcard-pic').length === 0)
    ok('tap: flipped card keeps the chosen word visible',
      $('.optcard.flipped .flip-word')?.textContent === q0.options[correctIdx].label)
    // The reveal swaps ONE face in normal flow. Its box must be byte-for-byte
    // the same 3:2 box, otherwise the card visibly changes shape on flip.
    const afterCards = $$('.optcard')
    // offsetWidth/offsetHeight are the layout box, unaffected by the rotateY
    // reveal animation (getBoundingClientRect would report a squashed box).
    const afterFaces = afterCards.map((c) => {
      const f = c.querySelector('.flip-face')
      return { w: f.offsetWidth, h: f.offsetHeight }
    })
    const beforeFaces = window.__geometry.faceRects.map(([w, h]) => ({ w, h }))
    ok('tap: flipped face keeps the exact same 3:2 ratio',
      afterFaces.every((r) => close(ratio(r), DESKTOP_RATIO)),
      `ratios=${afterFaces.map((r) => ratio(r).toFixed(3)).join(', ')}`)
    ok('tap: the picture face has the same box as the three word faces',
      afterFaces.every((r) => close(r.w, afterFaces[0].w, 1) && close(r.h, afterFaces[0].h, 1)),
      JSON.stringify(afterFaces))
    ok('tap: no card changed size during the flip',
      afterFaces.every((r, i) => close(r.w, beforeFaces[i].w, 1) && close(r.h, beforeFaces[i].h, 1)),
      JSON.stringify({ before: beforeFaces, after: afterFaces }))
    ok('tap: illustration stays inside the 3:2 face', Boolean(back && pic && (() => {
      const br = rect(back)
      return pr.x >= br.x - 1 && pr.y >= br.y - 1 &&
        pr.x + pr.w <= br.x + br.w + 1 && pr.y + pr.h <= br.y + br.h + 1
    })()), JSON.stringify({ back: rect(back), pic: pr }))
    window.__finish()
    return out.join('\n')
  }
  window.__finish = function () {
    const pass = out.filter((x) => x.startsWith('PASS')).length
    const fail = out.filter((x) => x.startsWith('FAIL')).length
    document.getElementById('out').textContent = out.join('\n') + `\n\nTOTAL ${pass} passed, ${fail} failed`
  }
  window.__ready = true
  document.getElementById('out').textContent = out.join('\n') + '\nWAITING_FOR_TAP'
})()
</script>
</body>
</html>
