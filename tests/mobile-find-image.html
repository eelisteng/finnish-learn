<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移动端找图模式回归 · mobile find-image regression</title>
<link rel="stylesheet" href="../app/styles.css">
<style>
  body{background:var(--bg);color:var(--text)}
  #out{padding:12px;font:12px/1.5 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div><div id="modal-root"></div><div id="toast" class="toast"></div>
<pre id="out">RUNNING</pre>
<script>
/* This page is driven by scripts/test-mobile.mjs, which uses the DevTools
   Protocol for real device metrics + real touch events. It seeds a paused
   find-image session, reloads, resumes it, and exposes assertions before and
   after a synthetic finger tap on the correct card. */
if (!sessionStorage.getItem('fi-mobile-stage')) localStorage.removeItem('finnish-learn:v1')
window.FI_FAST_TEST = false; window.FI_TEST_AUTOPLAY = true; window.FI_TEST_FIXED_ITEMS = true
try {
  Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true,
    value: class { constructor(text) { this.text = text; this.lang = ''; this.rate = 1; this.pitch = 1 } } })
  Object.defineProperty(window, 'speechSynthesis', { configurable: true,
    value: { cancel() {}, speak() {}, getVoices() { return [] } } })
} catch (e) { /* built-ins may be non-configurable */ }
window.Audio = class {
  constructor() { this._src = '' }
  set src(v) { this._src = v } get src() { return this._src }
  set currentTime(v) {} get currentTime() { return 0 }
  pause() {} play() { return Promise.resolve() }
}
</script>
<script src="../app/data.js"></script>
<script src="../app/grouping.js"></script>
<script src="../app/i18n.js"></script>
<script src="../app/store.js"></script>
<script src="../app/bgm.js"></script>
<script src="../app/main.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)]
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const LONG = location.search.includes('long')
  const out = []
  const ok = (name, cond, detail = '') => out.push(`${cond ? 'PASS' : 'FAIL'} ${name}${cond ? '' : ' :: ' + detail}`)
  const rect = (el) => { if (!el) return null; const r = el.getBoundingClientRect(); return { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1) } }
  const css = (el, prop) => el ? getComputedStyle(el)[prop] : null

  if (!sessionStorage.getItem('fi-mobile-stage')) {
    sessionStorage.setItem('fi-mobile-stage', '1')
    const g = window.FI_DATA.groups.groups.find((x) => x.id === 'A1-W-01')
    const pack = window.FI_DATA.pack
    const scope = g.itemIds.slice()
    const pipeline = FI.buildPipeline('word', FI.DEFAULT_MODES)
    const questions = FI.buildSelectQuestions(g, pack, {
      scopeIds: scope, seed: 0, optionCount: 4, textOnly: true,
      hideLabel: false, meaningLang: 'both',
    })
    // Stress the narrow phone columns with the longest real workbook lemmas.
    const longWords = ['henkilöllisyystodistus', 'todennäköisesti', 'yhteisymmärrys', 'kansainvälinen']
    if (LONG) questions.forEach((q) => q.options.forEach((o, i) => { o.label = longWords[i] }))
    const session = {
      groupId: g.id, level: g.level, kind: 'word', itemIds: scope, seed: 0,
      pipeline, pipelineIndex: pipeline.indexOf('findImage'), phase: 'findImage',
      scopeIds: scope, attempt: 1, retryCount: 0, results: {}, lastResult: null,
      lastWrongIds: [], startedAt: new Date().toISOString(), _spoken: null, _flipSpoken: null,
      round: { mode: 'findImage', scopeIds: scope, attempt: 1, index: 0, questions,
        answers: [], feedback: null, hintsUsed: 0, hintRevealed: [], slots: [], lastInput: '',
        speed: 'normal', selected: null, flash: null, matched: [], mismatches: [], pairs: null },
    }
    const state = FI.Store.load()
    state.session = session; state.paused = true
    FI.Store.save(state)
    location.reload()
    return
  }

  const resume = $('[data-act="resume"]')
  if (resume) resume.click()
  await wait(90)

  /* ── assertions before the tap ───────────────────────────── */
  const grid = $('.optcards.find-image')
  const cards = $$('.optcard')
  const tracks = (css(grid, 'gridTemplateColumns') || '').trim().split(/\s+/).filter(Boolean)
  ok('mobile: viewport is a phone width', window.innerWidth <= 640, `innerWidth=${window.innerWidth}`)
  ok('mobile: find-image uses exactly 2 columns', tracks.length === 2, `tracks=${tracks.join(' | ')}`)
  ok('mobile: four word options rendered', cards.length === 4, `got ${cards.length}`)
  ok('mobile: cards do not overflow the viewport', cards.every((c) => {
    const r = rect(c); return r.x >= 0 && r.x + r.w <= window.innerWidth + 1
  }), JSON.stringify(cards.map(rect)))

  let definite = true, wrapOk = true, linesOk = true, flowOk = true, pointersOk = true
  const lineStats = []
  cards.forEach((c) => {
    const face = c.querySelector('.flip-face')
    const inner = c.querySelector('.flip-inner')
    const label = c.querySelector('.optcard-label')
    const cr = rect(c), fr = rect(face), lr = rect(label)
    const lh = parseFloat(css(label, 'lineHeight')) || parseFloat(css(label, 'fontSize')) * 1.3
    const lines = lr.h / lh
    lineStats.push(`${label.textContent}:${lines.toFixed(1)}`)
    if (!fr || fr.w < cr.w - 2) definite = false
    if (css(face, 'position') !== 'relative' || css(face, 'backfaceVisibility') === 'hidden') flowOk = false
    if (css(label, 'wordBreak') !== 'normal' || !/anywhere|break-word/.test(css(label, 'overflowWrap') || '')) wrapOk = false
    if (lines > 3.2) linesOk = false
    if (css(inner, 'pointerEvents') !== 'none' || css(face, 'pointerEvents') !== 'none') pointersOk = false
  })
  ok('mobile: each face has a definite full-width box (no abspos shrink)', definite)
  ok('mobile: faces are in normal flow with no 3D backface dependency', flowOk)
  ok('mobile: labels use standard wrapping, not legacy break-word', wrapOk)
  ok('mobile: no label stacks one glyph per line', linesOk, `lines=${lineStats.join(', ')}`)
  ok('mobile: overlay children never swallow the button tap', pointersOk)
  ok('mobile: no picture before answering', $$('.optcard .optcard-pic').length === 0 && $$('.flip-back').length === 0)

  const q0 = FI.Store.load().session.round.questions[0]
  const correctIdx = q0.options.findIndex((o) => o.id === q0.itemId)
  const cr = rect(cards[correctIdx])
  window.__tapTarget = { x: cr.x + cr.w / 2, y: cr.y + cr.h / 2 }
  window.__correctIdx = correctIdx
  // On a 320px phone the second row can sit below the fold. Scroll it into
  // view before the CDP runner dispatches a touch, otherwise the tap lands
  // outside the emulated screen.
  window.__prepareTap = function () {
    const c = cards[correctIdx]
    c.scrollIntoView({ block: 'center', inline: 'center' })
    const r = rect(c)
    return { x: r.x + r.w / 2, y: r.y + r.h / 2 }
  }

  /* ── assertions after a real touch tap ────────────────────── */
  window.__afterTap = function () {
    const flipped = $$('.optcard.flipped')
    const back = $('.optcards.find-image .flip-back')
    const pic = $('.optcards.find-image .flip-back .optcard-pic')
    const pr = rect(pic)
    ok('tap: the touch reached the button and set feedback', flipped.length === 1, `flipped=${flipped.length}`)
    ok('tap: the back face with the illustration is rendered', Boolean(back && pic))
    ok('tap: illustration has real visible size', Boolean(pr && pr.w > 20 && pr.h > 20), JSON.stringify(pr))
    ok('tap: back face is not a rotated 3D layer', Boolean(back) &&
      !/matrix3d/.test(css(back, 'transform') || '') && css(back, 'backfaceVisibility') !== 'hidden',
      `transform=${css(back, 'transform')}`)
    ok('tap: the other three cards stay word-only', $$('.optcard:not(.flipped) .optcard-pic').length === 0)
    ok('tap: flipped card keeps the chosen word visible',
      $('.optcard.flipped .flip-word')?.textContent === q0.options[correctIdx].label)
    window.__finish()
    return out.join('\n')
  }
  window.__finish = function () {
    const pass = out.filter((x) => x.startsWith('PASS')).length
    const fail = out.filter((x) => x.startsWith('FAIL')).length
    document.getElementById('out').textContent = out.join('\n') + `\n\nTOTAL ${pass} passed, ${fail} failed`
  }
  window.__ready = true
  document.getElementById('out').textContent = out.join('\n') + '\nWAITING_FOR_TAP'
})()
</script>
</body>
</html>
